
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms_user
      POSTGRES_PASSWORD: dms_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms_user -d dms"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    user: "1000:1000"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/dms-realm.json
    ports:
      - "8081:8080"
    command: start-dev --import-realm
    volumes:
      - ./dms-realm.json:/opt/keycloak/data/import/dms-realm.json
      - keycloak_data:/opt/keycloak/data

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: dms_user
      DB_PASSWORD: dms_password
      DB_NAME: dms
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: dms
      KEYCLOAK_CLIENT_ID: dms-service
      KEYCLOAK_CLIENT_SECRET: your-service-secret-key

volumes:
  postgres_data:
  keycloak_data: 